plugins { id 'com.android.application' }

android {
    namespace 'com.jairo.minhacamera'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jairo.minhacamera'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
